[package]
name = "ratatai"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"] }
dotenvy = "0.15.7"
google-ai-rs = "0.3.0"
ratatui = "0.30.0"
tempfile = "3.27.0"
textwrap = "0.16.2"
chrono = "0.4.44"
throbber-widgets-tui = "0.11.0"
tokio = { version = "1.50.0", features = ["full"] }
launchpad_api_client = { path = "../launchpad_api_client" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
  "registry",
  "env-filter",
] }
tracing-appender = "0.2.4"
anyhow = "1.0.102"
regex = "1.12.3"
reqwest = "0.13.2"
scraper = "0.26.0"

[dev-dependencies]
mockito = "1.7.2"

 
